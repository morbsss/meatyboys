<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset="utf-8">
			<title>Meaty Boys Cup</title>
			<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
			<link rel="icon" href="images/animal.gif" type="image/gif">
			<link rel="icon" href="favicon.ico" type="image/x-icon">
			<meta name="description" content="Meaty Boys Cup">
			<meta name="author" content="SitePoint">
			<meta name="viewport" content="width=device-width, initial-scale=1">
			<script src="https://kit.fontawesome.com/408615a420.js" crossorigin="anonymous"></script>
			<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
			<link rel="stylesheet" href="javascripts/bootstrap-3.3.7-dist/css/bootstrap.min.css">
			<script type="text/javascript" src="javascripts/jquery.touchSwipe.min.js"></script>
			<script src="javascripts/bootstrap-3.3.7-dist/js/bootstrap.min.js"></script>
			<script src="javascripts/main.js?v=3"></script>
<style>

	.myTable{
		color: black;
	}
	.myTTitle{
		font-size: 160%;
		text-align:center;
	}
	.myRow{
		border: 2px solid black;
		text-align:center;
	}
	.rName {
		font-size: 200%;
		padding-top:15px;

	}
	.rScore{
		padding-top:0px;
		font-size: 350%;
	}
	.rOwner{
		font-size: 120%;
	}
	.navButton{
		display:inline-block;
	}
	.verticaltext{
		width:1px;
		word-wrap: break-word;
		padding:0px;
		text-align:center;
	}
	.navBar{
		display:inline-block;
	}
	.loader{
		 position: relative;
		left: 40%;
	}
	.timeStamp{
		float: right;
	}
	.heading{
		text-align:center;
		font-size:200%;
		font-weight:bold;
		display: flex;
		justify-content: center;
		align-items: center;
		gap: 40px;
		padding: 20px 0;
	}
	.score-section {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 10px;
	}
	.score-section-name {
		font-size: 18px;
		font-weight: bold;
		color: #333;
	}
	.score-display {
		font-size: 48px;
		font-weight: bold;
		min-width: 80px;
		text-align: center;
	}
	.vs-divider {
		font-size: 24px;
		color: #999;
		font-weight: bold;
	}
	.game-clock {
		font-size: 24px;
		color: #444;
		font-weight: bold;
		text-align: center;
		margin: -10px 0 10px;
	}
	.titleH{
		display: none;
	}
	.titleA{
		display: none;
	}
    .dropStyle{
       text-align:center;
    }

    .bodyStyle{
        padding-top:60px;
	}
    .leftBorder{
        border-left:2px;
        border-color:#9d9d9d;
        border-left-style: solid;
    }
    .bottom-nav { display: none; }
    .round-dropdown-mobile { display: none; }
    @media (max-width: 767px) {
        #navZoom    { display: none; }
        .bodyStyle  { padding-top: 0 !important; }
        body        { padding-bottom: 56px; }
        .round-dropdown-mobile {
            display: block;
            width: calc(100% - 24px);
            margin: 8px 12px 4px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            color: #333;
        }
        /* scaled-down desktop layout */
        .heading {
            gap: 10px;
            padding: 10px 0;
            font-size: 100%;
        }
        .score-section { gap: 4px; }
        .score-section-name { font-size: 13px; }
        .score-display { font-size: 30px; min-width: 50px; }
        .vs-divider { font-size: 16px; }
        #playerTable { font-size: 11px; }
        #playerTable td { padding: 3px 1px !important; }
        .rName  { font-size: 105%; padding-top: 3px; }
        .rScore { font-size: 160%; }
        .verticaltext { font-size: 8px; }
        #playerTable td i { font-size: 11px !important; }
        /* bottom nav */
        .bottom-nav {
            display: flex;
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 56px;
            background: #222;
            z-index: 1030;
            border-top: 1px solid #444;
        }
        .bottom-nav a {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9d9d9d;
            font-size: 13px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bottom-nav a + a { border-left: 1px solid #444; }
        .bottom-nav a.active { color: #fff; background: #2d2d2d; }
    }
    .tValh{
      font-size:200%;
      padding-right:15%;
      padding-left:15%;

    }
    .tVala{
      font-size:200%;
      padding-left:15%;
      padding-right:15%;
    }

</style>
	</head>
	<body>
		<nav id="navZoom" class="navbar navbar-inverse navbar-fixed-top navFormat">
			<div class="container-fluid">
				<div id="headerNav" class="navbar-header">
					<button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
						<span class="sr-only">Toggle navigation</span>
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
					</button>
				</div>
				<div id="navbar" class="navbar-collapse collapse">
					<ul class="nav navbar-nav navbar-left" id="navBar">
						<li class="dropdown">
							<a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">Games This Week <span class="caret"></span></a>
							<ul class="dropdown-menu" id="games">
							</ul>
						</li>
						<li class="dropdown">
							<a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">Byes <span class="caret"></span></a>
							<ul class="dropdown-menu" id="byes">
							</ul>
						</li>
						<li class="dropdown">
							<a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false" id="round">Round<span class="caret"></span></a>
							<ul class="dropdown-menu" id="roundList">
							</ul>
						</li>
						<li>
							<a href="javascript:;" onclick="toggleSortBy()" id="sortBy" class="leftBorder" data-toggle="collapse" data-target=".navbar-collapse.in" >Sort by Position</a>
						</li>
						<li>
							<a href="/leaguetable" class="leftBorder" data-toggle="collapse" data-target=".navbar-collapse.in">League Table</a>
						</li>
						<li>
							<a href="/finals" class="leftBorder" data-toggle="collapse" data-target=".navbar-collapse.in">Finals</a>
						</li>
						<li>
							<a href="/analysis" class="leftBorder" data-toggle="collapse" data-target=".navbar-collapse.in">Analysis</a>
						</li>
						<li>
							<a href="/teamoftheweek" class="leftBorder" data-toggle="collapse" data-target=".navbar-collapse.in">Team of the Week</a>
						</li>
						<li>
							<a href="/champ" class="leftBorder" data-toggle="collapse" data-target=".navbar-collapse.in">Champ</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>
		<div class="container-fluid bodyStyle" id="dashSpace" >
			<select id="roundDropdown" class="round-dropdown-mobile" onchange="setRound(parseInt(this.value))"></select>
			<div class="heading">
				<div class="score-section">
					<div class="score-section-name" id="homeT">Home</div>
					<div class="score-display" id="scoreHome" style="color: #333;">-</div>
				</div>
				<div class="vs-divider">VS</div>
				<div class="score-section">
					<div class="score-section-name" id="awayT">Away</div>
					<div class="score-display" id="scoreAway" style="color: #333;">-</div>
				</div>
			</div>
			<div class="game-clock" id="gameClock"></div>
			<img class="loader" id="loader" src="images/animal.gif">
			<table  class="table myTable" id="playerTable" >
			</table>
		</div>
		<div class="bottom-nav">
			<a href="/" class="active">Scores</a>
			<a href="/leaguetable">Table</a>
			<a href="/finals">Finals</a>
			<a href="/analysis">Analysis</a>
		</div>
	</body>
</html>
