<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Meaty Boys Cup &mdash; Finals</title>
		<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
		<link rel="icon" href="favicon.ico" type="image/x-icon">
		<meta name="description" content="Meaty Boys Cup">
		<script src="https://kit.fontawesome.com/408615a420.js" crossorigin="anonymous"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
		<link rel="stylesheet" href="javascripts/bootstrap-3.3.7-dist/css/bootstrap.min.css">
		<script type="text/javascript" src="javascripts/jquery.touchSwipe.min.js"></script>
		<script src="javascripts/bootstrap-3.3.7-dist/js/bootstrap.min.js"></script>
		<script src="javascripts/finals.js?v=4"></script>
		<style>
			body        { background: #fff; }
			.bodyStyle  { padding-top: 68px; }
			.leftBorder { border-left: 2px solid #9d9d9d; }
			.heading    { text-align: center; font-size: 200%; font-weight: bold; margin-bottom: 24px; }
			.loader     { display: block; margin: 50px auto; height: 80px; }

			/* ── section title ──────────────────────────────────────── */
			.sec-title {
				font-size: 112%;
				font-weight: bold;
				color: #fff;
				padding: 9px 16px;
				border-radius: 6px 6px 0 0;
				letter-spacing: 0.4px;
			}
			.sec-title.champ { background: #1a7a3c; }
			.sec-title.sacko { background: #8b1a1a; }

			/* ── outer wrapper ──────────────────────────────────────── */
			.bracket-wrap {
				border: 1px solid #ddd;
				border-top: none;
				border-radius: 0 0 6px 6px;
				background: #fff;
				margin-bottom: 28px;
				overflow: hidden;
			}

			/* ── CSS grid: 5 cols × 3 rows ──────────────────────────── */
			.bgrid {
				display: grid;
				grid-template-columns: 1fr 32px minmax(130px, 180px) 32px 1fr;
				grid-template-rows: 44px 64px 64px;
				padding: 16px 14px 8px;
				gap: 3px 0;
			}

			/* ── labels row ─────────────────────────────────────────── */
			.lbl {
				display: flex;
				align-items: flex-end;
				justify-content: center;
				padding-bottom: 6px;
				font-size: 10px;
				font-weight: bold;
				text-transform: uppercase;
				letter-spacing: 1.2px;
				color: #bbb;
				line-height: 1.3;
				text-align: center;
			}
			.final-lbl { color: #888; font-size: 11px; }

			/* ── team bars ──────────────────────────────────────────── */
			.bar {
				display: flex;
				align-items: center;
				padding: 0 10px;
				border-radius: 4px;
				gap: 8px;
				height: 60px;
				align-self: center;
			}
			.bar.champ     { background: #1a7a3c; color: #fff; }
			.bar.sacko     { background: #8b1a1a; color: #fff; }
			.bar.hi        { opacity: 1; }
			.bar.dim       { opacity: 0.38; }
			.bar.tbd-bar   { background: #f0f0f0; color: #bbb; }
			.bar.fin-bar   { border-radius: 4px; }

			.bar-seed {
				width: 22px; height: 22px;
				border-radius: 50%;
				background: rgba(255,255,255,0.22);
				font-size: 10px; font-weight: bold;
				display: flex; align-items: center; justify-content: center;
				flex-shrink: 0;
			}
			.bar-name  { flex: 1; font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
			.bar-score { font-size: 18px; font-weight: bold; flex-shrink: 0; }

			/* ── bracket arms (pseudo-element lines centred in each row) ── */
			.aul, .all, .aur, .alr { position: relative; align-self: stretch; }

			/* Upper-left: horizontal from team-A-centre → bottom-right corner */
			.aul::before {
				content: ''; position: absolute;
				top: 50%; left: 0; right: 0; bottom: -4px;
				border-top: 2px solid #ccc; border-right: 2px solid #ccc;
			}
			/* Lower-left: top-right corner → horizontal to team-B-centre */
			.all::before {
				content: ''; position: absolute;
				top: -4px; left: 0; right: 0; bottom: 50%;
				border-bottom: 2px solid #ccc; border-right: 2px solid #ccc;
			}
			/* Upper-right mirror */
			.aur::before {
				content: ''; position: absolute;
				top: 50%; left: 0; right: 0; bottom: -4px;
				border-top: 2px solid #ccc; border-left: 2px solid #ccc;
			}
			/* Lower-right mirror */
			.alr::before {
				content: ''; position: absolute;
				top: -4px; left: 0; right: 0; bottom: 50%;
				border-bottom: 2px solid #ccc; border-left: 2px solid #ccc;
			}

			/* ── result banner ──────────────────────────────────────── */
			.result-banner {
				text-align: center;
				padding: 10px 16px;
				font-size: 15px;
				font-weight: bold;
				border-top: 1px solid #eee;
			}
			.result-banner.champ { color: #1a7a3c; background: #f0faf4; }
			.result-banner.sacko { color: #8b1a1a; background: #fff5f5; }

			/* ── breakdown section ──────────────────────────────────── */
			.bdown-wrap {
				padding: 10px 14px 12px;
				border-top: 1px solid #f0f0f0;
				background: #fafafa;
			}
			.bdown-label {
				font-size: 10px;
				font-weight: bold;
				text-transform: uppercase;
				letter-spacing: 0.8px;
				color: #bbb;
				margin: 8px 0 3px;
			}
			.bdown-label:first-child { margin-top: 0; }
			.bdown-row {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 3px 0;
				font-size: 12px;
			}
			.bdown-seed {
				width: 18px; height: 18px;
				border-radius: 50%;
				font-size: 9px; font-weight: bold; color: #fff;
				display: flex; align-items: center; justify-content: center;
				flex-shrink: 0;
			}
			.bdown-seed.champ { background: #1a7a3c; }
			.bdown-seed.sacko { background: #8b1a1a; }
			.bdown-name   { flex: 1; font-weight: bold; color: #555; }
			.bdown-scores { color: #999; font-size: 11px; white-space: nowrap; }

			/* ── live indicator ─────────────────────────────────────── */
			.liveCatTop {
				position: absolute;
				top: 68px;
				right: 16px;
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.liveCatLabel {
				font-size: 13px;
				color: #999;
				font-style: italic;
			}
			.liveCatImg { height: 28px; }

			/* ── mobile ─────────────────────────────────────────────── */
			@media (max-width: 767px) {
				.bgrid {
					grid-template-columns: 1fr 18px minmax(110px,140px) 18px 1fr;
					grid-template-rows: 36px 56px 56px;
					padding: 10px 8px 6px;
				}
				.bar { height: 52px; padding: 0 7px; gap: 5px; }
				.bar-score { font-size: 15px; }
				.bar-name  { font-size: 11px; }
				.bdown-scores { display: none; }
			}
		</style>
	</head>
	<body>
		<nav id="navZoom" class="navbar navbar-inverse navbar-fixed-top navFormat">
			<div class="container-fluid">
				<div id="headerNav" class="navbar-header">
					<button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
					        data-target="#navbar" aria-expanded="false" aria-controls="navbar">
						<span class="sr-only">Toggle navigation</span>
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
					</button>
				</div>
				<div id="navbar" class="navbar-collapse collapse">
					<ul class="nav navbar-nav navbar-left">
						<li><a href="/">Scoreboard</a></li>
						<li><a href="/leaguetable" class="leftBorder">League Table</a></li>
						<li class="active"><a href="/finals" class="leftBorder">Finals</a></li>
					</ul>
				</div>
			</div>
		</nav>

		<div class="container-fluid bodyStyle">
			<div class="heading">Finals</div>
			<div id="liveCatTop" class="liveCatTop" style="display:none;">
				<img src="images/animal.gif" class="liveCatImg" alt="live" id="liveCatImg">
				<span id="liveRoundLabel" class="liveCatLabel"></span>
				<span id="lastUpdatedLabel" class="liveCatLabel" style="display:none;"></span>
			</div>
			<img class="loader" id="loader" src="images/animal.gif">
			<div id="finalsWrap" style="display:none;">
				<div id="champSection"></div>
				<div id="sackoSection"></div>
			</div>
		</div>
	</body>
</html>
