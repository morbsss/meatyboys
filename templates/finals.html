<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Meaty Boys Cup &mdash; Finals</title>
		<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
		<link rel="icon" href="images/animal.gif" type="image/gif">
		<link rel="icon" href="favicon.ico" type="image/x-icon">
		<meta name="description" content="Meaty Boys Cup">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script src="https://kit.fontawesome.com/408615a420.js" crossorigin="anonymous"></script>
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.0/jquery.min.js"></script>
		<link rel="stylesheet" href="javascripts/bootstrap-3.3.7-dist/css/bootstrap.min.css">
		<script type="text/javascript" src="javascripts/jquery.touchSwipe.min.js"></script>
		<script src="javascripts/bootstrap-3.3.7-dist/js/bootstrap.min.js"></script>
		<script src="javascripts/finals.js?v=4"></script>
		<style>
			body        { background: #fff; }
			.bodyStyle  { padding-top: 68px; }
			.leftBorder { border-left: 2px solid #9d9d9d; }
			.heading    { text-align: center; font-size: 200%; font-weight: bold; margin-bottom: 24px; }
			.loader     { display: block; margin: 50px auto; height: 80px; }

			/* ── section title ──────────────────────────────────────── */
			.sec-title {
				font-size: 112%;
				font-weight: bold;
				color: #fff;
				padding: 9px 16px;
				border-radius: 6px 6px 0 0;
				letter-spacing: 0.4px;
			}
			.sec-title.champ { background: #1a7a3c; }
			.sec-title.sacko { background: #8b1a1a; }

			/* ── outer wrapper ──────────────────────────────────────── */
			.bracket-wrap {
				border: 1px solid #ddd;
				border-top: none;
				border-radius: 0 0 6px 6px;
				background: #fff;
				margin-bottom: 28px;
				overflow: hidden;
			}

			/* ── CSS grid: 5 cols × 4 rows ──────────────────────────── */
			.bgrid {
				display: grid;
				grid-template-columns: 1fr 32px 1fr 32px 1fr;
				grid-template-rows: 38px 64px 0 64px;
				padding: 4px 14px 8px;
				gap: 0 0;
			}

			/* ── labels row ─────────────────────────────────────────── */
			.lbl {
				display: flex;
				align-items: flex-end;
				justify-content: center;
				padding-bottom: 6px;
				font-size: 10px;
				font-weight: bold;
				text-transform: uppercase;
				letter-spacing: 1.2px;
				color: #bbb;
				line-height: 1.3;
				text-align: center;
			}
			.final-lbl { color: #888; font-size: 11px; }

			/* ── team bars ──────────────────────────────────────────── */
			.bar {
				display: flex;
				align-items: center;
				padding: 0 10px;
				border-radius: 4px;
				gap: 8px;
				height: 60px;
				align-self: center;
			}
			.bar.champ     { background: #1a7a3c; color: #fff; }
			.bar.sacko     { background: #8b1a1a; color: #fff; }
			.bar.hi        { opacity: 1; }
			.bar.dim       { opacity: 0.38; }
			.bar.tbd-bar   { background: #f0f0f0; color: #bbb; }
			.bar.fin-bar   { border-radius: 4px; }

			.bar-seed {
				width: 22px; height: 22px;
				border-radius: 50%;
				background: rgba(255,255,255,0.22);
				font-size: 10px; font-weight: bold;
				display: flex; align-items: center; justify-content: center;
				flex-shrink: 0;
			}
			.bar-name  { flex: 1; font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
			.bar-score { font-size: 18px; font-weight: bold; flex-shrink: 0; }

			/* ── bracket arms (pseudo-element lines centred in each row) ── */
			.aul, .all, .aur, .alr, .aml, .amr { position: relative; align-self: stretch; }

			/* Upper-left: horizontal from team-A-centre → bottom-right corner */
			.aul::before {
				content: ''; position: absolute;
				top: 50%; left: 0; right: 50%; bottom: -4px;
				border-top: 2px solid #ccc; border-right: 2px solid #ccc;
			}
			/* Lower-left: top-right corner → horizontal to team-B-centre */
			.all::before {
				content: ''; position: absolute;
				top: -4px; left: 0; right: 50%; bottom: 50%;
				border-bottom: 2px solid #ccc; border-right: 2px solid #ccc;
			}
			/* Upper-right mirror */
			.aur::before {
				content: ''; position: absolute;
				top: 50%; left: 50%; right: 0; bottom: -4px;
				border-top: 2px solid #ccc; border-left: 2px solid #ccc;
			}
			/* Lower-right mirror */
			.alr::before {
				content: ''; position: absolute;
				top: -4px; left: 50%; right: 0; bottom: 50%;
				border-bottom: 2px solid #ccc; border-left: 2px solid #ccc;
			}

			/* middle-left: vertical through middle row + horizontal →  final box */
			.aml::before {
				content: ''; position: absolute;
				top: -4px; left: calc(50% - 2px); bottom: -4px; width: 2px;
				background: #ccc;
			}
			.aml::after {
				content: ''; position: absolute;
				top: calc(50% - 1px); left: 50%; right: -4px; height: 2px;
				background: #ccc;
			}

			/* middle-right: vertical through middle row + horizontal ← final box */
			.amr::before {
				content: ''; position: absolute;
				top: -4px; left: 49%; bottom: -4px; width: 2px;
				background: #ccc;
			}
			.amr::after {
				content: ''; position: absolute;
				top: calc(50% - 1px); left: 0; right: 50%; height: 2px;
				background: #ccc;
			}

			/* ── result banner ──────────────────────────────────────── */
			.result-banner {
				text-align: center;
				padding: 10px 16px;
				font-size: 15px;
				font-weight: bold;
				border-top: 1px solid #eee;
			}
			.result-banner.champ { color: #1a7a3c; background: #f0faf4; }
			.result-banner.sacko { color: #8b1a1a; background: #fff5f5; }

			/* ── breakdown section ──────────────────────────────────── */
			.bdown-wrap {
				padding: 10px 14px 12px;
				border-top: 1px solid #f0f0f0;
				background: #fafafa;
			}
			.bdown-label {
				font-size: 10px;
				font-weight: bold;
				text-transform: uppercase;
				letter-spacing: 0.8px;
				color: #bbb;
				margin: 8px 0 3px;
			}
			.bdown-label:first-child { margin-top: 0; }
			.bdown-row {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 3px 0;
				font-size: 12px;
			}
			.bdown-seed {
				width: 18px; height: 18px;
				border-radius: 50%;
				font-size: 9px; font-weight: bold; color: #fff;
				display: flex; align-items: center; justify-content: center;
				flex-shrink: 0;
			}
			.bdown-seed.champ { background: #1a7a3c; }
			.bdown-seed.sacko { background: #8b1a1a; }
			.bdown-name   { flex: 1; font-weight: bold; color: #555; }
			.bdown-scores { color: #999; font-size: 11px; white-space: nowrap; }

			/* ── live indicator ─────────────────────────────────────── */
			.liveCatTop {
				position: absolute;
				top: 68px;
				right: 16px;
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.liveCatLabel {
				font-size: 13px;
				color: #999;
				font-style: italic;
			}
			.liveCatImg { height: 28px; }

			/* ── bottom nav (mobile only) ───────────────────────────── */
			.bottom-nav { display: none; }
			@media (max-width: 767px) {
				#navZoom  { display: none; }
				.bodyStyle { padding-top: 8px !important; }
				body { padding-bottom: 56px; }
				.bottom-nav {
					display: flex;
					position: fixed;
					bottom: 0; left: 0; right: 0;
					height: 56px;
					background: #222;
					z-index: 1030;
					border-top: 1px solid #444;
				}
				.bottom-nav a {
					flex: 1;
					display: flex;
					align-items: center;
					justify-content: center;
					color: #9d9d9d;
					font-size: 13px;
					font-weight: bold;
					text-decoration: none;
					text-transform: uppercase;
					letter-spacing: 0.5px;
				}
				.bottom-nav a + a { border-left: 1px solid #444; }
				.bottom-nav a.active { color: #fff; background: #2d2d2d; }
				/* live indicator - flow inline, right-aligned, smaller on mobile */
				.liveCatTop {
					position: static;
					justify-content: flex-end;
					flex-wrap: wrap;
					margin: 2px 10px 6px auto;
					padding: 0;
					gap: 2px 4px;
					text-align: right;
				}
				.liveCatLabel { font-size: 10px; }
				.liveCatImg   { height: 16px; }
			}

			/* ── mobile ─────────────────────────────────────────────── */
			@media (max-width: 767px) {
				.bgrid {
					grid-template-columns: 1fr 14px minmax(60px,84px) 14px 1fr;
					grid-template-rows: 52px 64px 0 64px;
					padding: 2px 6px 6px;
				}
				/* central trophy/sacko emoji - breathing room above + below */
				.lbl { padding-bottom: 4px; }
				.final-lbl { font-size: 9px; line-height: 1.2; letter-spacing: 0.6px; }
				.final-emoji {
					display: inline-block;
					font-size: 18px;
					line-height: 1;
					margin: 2px 0 4px;
				}
				/* team bars - stack score under name, allow names to wrap */
				.bar {
					height: 58px;
					padding: 4px 5px;
					gap: 1px 4px;
					flex-wrap: wrap;
					align-content: center;
				}
				.bar-seed { width: 18px; height: 18px; font-size: 9px; }
				.bar-name {
					font-size: 11px;
					line-height: 1.15;
					white-space: normal;
					word-break: break-word;
					text-align: center;
				}
				.bar-score {
					font-size: 14px;
					line-height: 1;
					flex-basis: 100%;
					text-align: center;
				}
				/* breakdown - stack R14/R15/AGG under team name on mobile */
				.bdown-row {
					flex-direction: column;
					align-items: flex-start;
					gap: 2px;
					padding: 6px 0;
				}
				.bdown-name { font-size: 12px; }
				.bdown-scores {
					display: block;
					font-size: 10px;
					white-space: normal;
				}
			}
		</style>
	</head>
	<body>
		<nav id="navZoom" class="navbar navbar-inverse navbar-fixed-top navFormat">
			<div class="container-fluid">
				<div id="headerNav" class="navbar-header">
					<button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
					        data-target="#navbar" aria-expanded="false" aria-controls="navbar">
						<span class="sr-only">Toggle navigation</span>
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
					</button>
				</div>
				<div id="navbar" class="navbar-collapse collapse">
					<ul class="nav navbar-nav navbar-left">
						<li><a href="/">Scoreboard</a></li>
						<li><a href="/leaguetable" class="leftBorder">League Table</a></li>
						<li class="active"><a href="/finals" class="leftBorder">Finals</a></li>
					</ul>
				</div>
			</div>
		</nav>

		<div class="container-fluid bodyStyle">
			<div class="heading">Finals</div>
			<div id="liveCatTop" class="liveCatTop" style="display:none;">
			<img src="/images/animal.gif" class="liveCatImg" alt="live" id="liveCatImg">
				<span id="liveRoundLabel" class="liveCatLabel"></span>
				<span id="lastUpdatedLabel" class="liveCatLabel" style="display:none;"></span>
			</div>
			<img class="loader" id="loader" src="images/animal.gif">
			<div id="finalsWrap" style="display:none;">
				<div id="champSection"></div>
				<div id="sackoSection"></div>
			</div>
		</div>
		<div class="bottom-nav">
			<a href="/">Scoreboard</a>
			<a href="/leaguetable">League Table</a>
			<a href="/finals" class="active">Finals</a>
		</div>
	</body>
</html>
