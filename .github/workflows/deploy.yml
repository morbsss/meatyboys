name: Deploy on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        shell: pwsh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          $sshDir = "$env:USERPROFILE\.ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null
          $env:SSH_PRIVATE_KEY | Out-File -Encoding ascii "$sshDir\id_ed25519"
          icacls "$sshDir\id_ed25519" /inheritance:r /grant:r "$env:USERNAME:F" | Out-Null

          # SSH config: skip host key checking and suppress KEX warnings for the VM
          "Host 149.28.178.14`n    StrictHostKeyChecking no`n    UserKnownHostsFile NUL" | Out-File -Encoding ascii "$sshDir\config"

      - name: Write .env.production
        shell: pwsh
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          $env:ENV_PRODUCTION | Out-File -Encoding ascii ".env.production"

      - name: Run deploy.ps1
        shell: pwsh
        run: .\deploy.ps1
