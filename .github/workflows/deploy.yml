name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy to dev (port 5000)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-dev-${{ github.head_ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh

      - name: Deploy to dev
        run: dagger call deploy-dev --ssh-private-key=env:SSH_PRIVATE_KEY --env-production=env:ENV_PRODUCTION
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}

  deploy-prod:
    name: Deploy to production (port 80)
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Dagger
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin sh

      - name: Deploy to production
        run: dagger call deploy --ssh-private-key=env:SSH_PRIVATE_KEY --env-production=env:ENV_PRODUCTION
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
